# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── Database ─────────────────────────────────────────────────────────────────
# Defaults to H2 in-memory. Override with SPRING_DATASOURCE_* or DATABASE_URL for PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:eventspheredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ─── SQL Initialization (Pure JDBC) ───────────────────────────────────────────
# Automatically runs classpath:schema.sql on startup for both H2 and PostgreSQL
spring.sql.init.mode=always

# ─── H2 Console (dev only) ───────────────────────────────────────────────────
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.eventsphere=INFO

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Key that signs login tokens. Set EVENTSPHERE_JWT_SECRET (at least 32 characters) to keep logins across restarts.
# When it is not set, the app makes a random key on every startup.
eventsphere.jwt.secret=${EVENTSPHERE_JWT_SECRET:}
eventsphere.jwt.ttl-hours=8

# ─── CORS ────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
