# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── H2 In-Memory Database ───────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:eventspheredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── H2 Console (dev only) ───────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.eventsphere=DEBUG

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Key that signs login tokens. Set EVENTSPHERE_JWT_SECRET (at least 32 characters) to keep logins across restarts.
# When it is not set, the app makes a random key on every startup.
eventsphere.jwt.secret=${EVENTSPHERE_JWT_SECRET:}
eventsphere.jwt.ttl-hours=8
